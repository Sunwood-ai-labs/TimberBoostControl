<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">TimberBoostControl v0.1.0 release header</title>
  <desc id="desc">A release banner with the TimberBoostControl emblem and v0.1.0 release title.</desc>
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f2820" />
      <stop offset="1" stop-color="#17372b" />
    </linearGradient>
    <linearGradient id="panel-bg" x1="420" y1="70" x2="1400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f4a3d" opacity="0.95" />
      <stop offset="1" stop-color="#122d24" opacity="0.85" />
    </linearGradient>
    <linearGradient id="badge-bg" x1="70" y2="390" y1="50" x2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#234b3a" />
      <stop offset="1" stop-color="#1e3f31" />
    </linearGradient>
    <linearGradient id="logo-bg" x1="110" x2="390" y1="110" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#214639" />
      <stop offset="1" stop-color="#10251e" />
    </linearGradient>
    <linearGradient id="logo-body" x1="146" x2="340" y1="98" y2="344" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7a55e" />
      <stop offset="1" stop-color="#a55f2e" />
    </linearGradient>
    <linearGradient id="logo-ring" x1="108" x2="348" y1="126" y2="374" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0b56e" />
      <stop offset="1" stop-color="#e46d2d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="420" rx="24" fill="url(#page-bg)" />
  <rect x="26" y="18" width="1348" height="384" rx="20" fill="url(#panel-bg)" />

  <rect x="52" y="52" width="360" height="316" rx="22" fill="url(#badge-bg)" />

  <g transform="translate(112, 102)" filter="url(#glow)">
    <circle cx="128" cy="128" r="108" fill="url(#logo-bg)" />
    <circle cx="128" cy="128" r="92" fill="none" stroke="#315f50" stroke-width="6" opacity="0.85" />
    <path d="M77 171c-18 8-30 23-35 45 20-5 37-17 47-34l-12-11z" fill="url(#logo-ring)" />
    <path d="M143 42c44 24 71 68 71 113 0 10-1 20-4 30l-48-7-43-92 24-44z" fill="url(#logo-body)" />
    <path d="M117 74c-33 21-56 58-61 100l27 25 47-21 55-9c1-5 1-10 1-14 0-33-17-66-43-87l-26 6z" fill="#b06a36" />
    <path d="M92 199 65 175l-18 42c21-2 35-9 45-18z" fill="#d88843" />
    <path d="M171 92c14 16 24 38 24 61 0 6-1 12-2 17l27 5c3-9 4-19 4-29 0-34-18-68-53-94v40z" fill="#8d4d27" opacity="0.9" />
    <circle cx="154" cy="92" r="18" fill="#f6e8cb" />
    <circle cx="154" cy="92" r="10" fill="#cfb58e" opacity="0.65" />
    <path d="M75 173 59 157l10-36 45-47 16 16-55 83z" fill="#7f4727" opacity="0.55" />
  </g>

  <g>
    <text x="456" y="118" fill="#f5efe4" font-size="56" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="0.2">
      TimberBoostControl
    </text>
    <text x="456" y="184" fill="#f2d7ac" font-size="39" font-family="Arial, Helvetica, sans-serif" font-weight="700">
      v0.1.0
    </text>
    <text x="456" y="235" fill="#f7ead5" font-size="32" font-family="Arial, Helvetica, sans-serif" opacity="0.96">
      JSON-Driven Blueprint Control Release
    </text>
    <text x="456" y="278" fill="#dfece7" font-size="25" font-family="Arial, Helvetica, sans-serif">
      Timberborn mod with runtime-readable settings and regenerating overrides
    </text>
    <line x1="456" y1="303" x2="1320" y2="303" stroke="#4f7a6d" stroke-width="2" opacity="0.6" />
    <text x="456" y="348" fill="#c2d8ce" font-size="22" font-family="Arial, Helvetica, sans-serif">
      Bottom-bar launcher • settings.json reload • .generated-files.txt cleanup
    </text>
    <text x="456" y="380" fill="#e9f3f0" font-size="16" font-family="Arial, Helvetica, sans-serif" opacity="0.75">
      Initial release notes
    </text>
  </g>
</svg>
